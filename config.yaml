# Voice Recognition Assistant Configuration
audio:
  sample_rate: 16000
  channels: 1
  format: 16
  chunk: 1024
  pre_emphasis_coeff: 0.97
  frame_length_ms: 25
  frame_shift_ms: 10
  fft_size: 512
  n_mels: 80

vad:
  aggressiveness: 2
  frame_duration_ms: 30
  energy_threshold: 0.01
  speech_ratio: 0.3

whisper:
  model_size: small
  language: zh
  beam_size: 5
  temperature: 0.0
  compute_type: int8

speaker:
  embedding_dim: 192
  similarity_threshold: 0.50
  enroll_samples: 3

intent:
  model_name: bert-base-chinese
  max_length: 64
  confidence_threshold: 0.5

